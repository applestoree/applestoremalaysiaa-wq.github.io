<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Produk Kelola Produk</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:'Inter',sans-serif;background:#f3f4f6;margin:0;padding:0}
.mobile-container{max-width:500px;width:100%;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:#fff;box-shadow:0 10px 25px -5px rgba(0,0,0,.1)}
@media(min-width:501px){body{display:flex;justify-content:center;align-items:center;height:100%}.mobile-container{height:90vh;border-radius:2rem;border:8px solid #1f2937}}
</style>
</head>
<body>
<div id="app" class="mobile-container">
<header class="bg-gray-900 text-white px-4 py-3 flex items-center justify-between shadow-md z-10">
<div class="flex items-center space-x-3"><button id="back-btn" class="hidden text-gray-300 hover:text-white p-2"><i class="fa-solid fa-arrow-left text-lg"></i></button><h1 id="app-title" class="text-lg font-semibold tracking-wide flex items-center gap-2"><i class="fa-brands fa-apple text-xl"></i> Apple Produk</h1></div>
<div><button id="add-product-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1.5 rounded-xl font-medium shadow flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Baru</button></div>
</header>
<main class="flex-1 overflow-y-auto relative bg-gray-50 flex flex-col" id="main-content"></main>
<div id="toast-container" class="absolute bottom-4 left-4 right-4 z-50 pointer-events-none flex flex-col gap-2 items-center"></div>
<div id="delete-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl"><div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-xl mb-4 mx-auto"><i class="fa-solid fa-triangle-exclamation"></i></div><h3 class="text-lg font-bold text-gray-900 text-center mb-1">Hapus Produk?</h3><p class="text-sm text-gray-500 text-center mb-6">Tindakan ini tidak dapat dibatalkan dari sistem.</p><div class="flex space-x-3"><button id="cancel-delete" class="flex-1 bg-gray-100 text-gray-700 font-medium py-2.5 rounded-xl">Batal</button><button id="confirm-delete" class="flex-1 bg-red-600 text-white font-medium py-2.5 rounded-xl">Hapus</button></div></div></div>
</div>
<script>
const API_BASE="https://jhpbtooefyzdndstlzva.supabase.co/functions/v1/apple-produk-kelola-produk";
let state={view:'list',formMode:'create',products:[],loading:false,searchQuery:'',selectedProductType:'',selectedAvailability:'',currentProduct:null,deleteTargetId:null};
const mainContent=document.getElementById('main-content'),backBtn=document.getElementById('back-btn'),addProductBtn=document.getElementById('add-product-btn'),appTitle=document.getElementById('app-title'),toastContainer=document.getElementById('toast-container'),deleteModal=document.getElementById('delete-modal');
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function showToast(message,type='success'){const t=document.createElement('div');t.className=`${type==='success'?'bg-gray-900':'bg-red-600'} text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-3`;t.innerHTML=`<i class="fa-solid ${type==='success'?'fa-circle-check text-emerald-400':'fa-circle-exclamation'}"></i><span>${esc(message)}</span>`;toastContainer.appendChild(t);setTimeout(()=>t.remove(),3500)}
async function fetchProducts(){state.loading=true;render();try{let u=API_BASE,p=new URLSearchParams();if(state.searchQuery)p.append('search',state.searchQuery);if(state.selectedProductType)p.append('product_type',state.selectedProductType);if(state.selectedAvailability)p.append('availability',state.selectedAvailability);if(p.toString())u+='?'+p;const r=await fetch(u);if(!r.ok)throw Error('Gagal mengambil data produk');const d=await r.json();state.products=Array.isArray(d)?d:(d.data||[])}catch(e){console.error(e);state.products=[];showToast('Gagal memuat daftar produk','error')}finally{state.loading=false;render()}}
async function saveProduct(payload,isEdit,id){try{const r=await fetch(isEdit?`${API_BASE}/${id}`:API_BASE,{method:isEdit?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){const e=await r.json().catch(()=>({}));throw Error(e.message||'Gagal menyimpan produk')}showToast(isEdit?'Produk berhasil diperbarui!':'Produk baru berhasil ditambahkan!');state.view='list';await fetchProducts()}catch(e){console.error(e);showToast(e.message,'error')}}
async function deleteProductApi(id){try{const r=await fetch(`${API_BASE}/${id}`,{method:'DELETE'});if(!r.ok)throw Error();showToast('Produk berhasil dihapus');fetchProducts()}catch(e){showToast('Gagal menghapus produk','error')}}
function renderProductListPage(){appTitle.innerHTML='<i class="fa-brands fa-apple text-xl"></i> Apple Produk';backBtn.classList.add('hidden');addProductBtn.classList.remove('hidden');const types=[...new Set(state.products.map(p=>p.product_type).filter(Boolean))];mainContent.innerHTML=`<div class="p-4 space-y-4"><div class="space-y-2"><div class="relative"><span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400"><i class="fa-solid fa-magnifying-glass"></i></span><input id="search-input" value="${esc(state.searchQuery)}" placeholder="Cari produk Apple..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></div><div class="flex gap-2"><select id="filter-type" class="flex-1 bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs"><option value="">Semua Tipe Produk</option>${types.map(t=>`<option value="${esc(t)}" ${state.selectedProductType===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select id="filter-avail" class="w-36 bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs"><option value="">Ketersediaan</option><option value="in stock" ${state.selectedAvailability==='in stock'?'selected':''}>In Stock</option><option value="out of stock" ${state.selectedAvailability==='out of stock'?'selected':''}>Out of Stock</option></select></div></div><div class="px-1 text-xs font-semibold text-gray-500 uppercase tracking-wider">Daftar Produk (${state.products.length})</div><div class="space-y-3 pb-6">${state.loading?'<div class="text-center py-16 text-xs text-gray-500">Memuat produk...</div>':state.products.length===0?'<div class="text-center py-16 bg-white rounded-3xl border border-dashed border-gray-200"><i class="fa-solid fa-box-open text-2xl text-gray-400"></i><p class="font-semibold text-gray-800 text-sm mt-3">Tidak ada produk ditemukan</p></div>':state.products.map(p=>`<div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm"><div class="flex items-start justify-between gap-2"><div><span class="inline-block px-2 py-0.5 bg-blue-50 text-blue-700 text-[10px] font-semibold rounded-md mb-1">${esc(p.product_type||'Apple Device')}</span><h3 class="font-semibold text-gray-900 text-sm">${esc(p.title)}</h3></div><span class="px-2 py-0.5 text-[10px] rounded-full ${p.availability==='in stock'?'bg-emerald-50 text-emerald-600':'bg-amber-50 text-amber-600'}">${esc(p.availability||'Unknown')}</span></div><p class="text-xs text-gray-500 line-clamp-2 mt-2">${esc(p.description||'Tidak ada deskripsi.')}</p><div class="pt-2 mt-2 border-t border-gray-100 flex items-center justify-between"><span class="font-mono text-[10px] text-gray-400">ID: ${esc(p.item_group_id)}</span><div class="flex gap-1.5"><button onclick="editProduct('${esc(p.item_group_id)}')" class="px-3 py-1 bg-gray-100 text-gray-700 text-xs font-medium rounded-lg"><i class="fa-solid fa-pen-to-square mr-1"></i>Edit</button><button onclick="promptDelete('${esc(p.item_group_id)}')" class="p-1.5 bg-red-50 text-red-600 rounded-lg"><i class="fa-solid fa-trash-can text-xs"></i></button></div></div></div>`).join('')}</div></div>`;document.getElementById('search-input').oninput=e=>{state.searchQuery=e.target.value;clearTimeout(window.searchTimeout);window.searchTimeout=setTimeout(fetchProducts,400)};document.getElementById('filter-type').onchange=e=>{state.selectedProductType=e.target.value;fetchProducts()};document.getElementById('filter-avail').onchange=e=>{state.selectedAvailability=e.target.value;fetchProducts()}}
function parseArray(v){if(Array.isArray(v))return v;if(!v)return[];try{const x=JSON.parse(v);return Array.isArray(x)?x:[]}catch{return[]}}
function inputRow(type,data={}){if(type==='color')return `<div class="json-row grid grid-cols-1 gap-2 p-3 bg-gray-50 rounded-xl border border-gray-200"><input data-key="color" value="${esc(data.color)}" placeholder="Color" class="json-color px-3 py-2 bg-white border rounded-lg text-sm"><input data-key="image_link" value="${esc(data.image_link)}" placeholder="Image Link" class="json-color px-3 py-2 bg-white border rounded-lg text-xs"><input data-key="additional_image_link" value="${esc(data.additional_image_link)}" placeholder="Additional Image Link" class="json-color px-3 py-2 bg-white border rounded-lg text-xs"><button type="button" onclick="this.parentElement.remove()" class="text-red-600 text-xs text-left"><i class="fa-solid fa-trash mr-1"></i>Hapus color</button></div>`;return `<div class="json-row grid grid-cols-2 gap-2 p-3 bg-gray-50 rounded-xl border border-gray-200"><input data-key="size" value="${esc(data.size)}" placeholder="Size" class="json-size px-3 py-2 bg-white border rounded-lg text-sm"><input data-key="price" type="number" value="${data.price??''}" placeholder="Price" class="json-size px-3 py-2 bg-white border rounded-lg text-sm"><input data-key="sale_price" type="number" value="${data.sale_price??''}" placeholder="Sale Price" class="json-size px-3 py-2 bg-white border rounded-lg text-sm"><button type="button" onclick="this.parentElement.remove()" class="text-red-600 text-xs text-left"><i class="fa-solid fa-trash mr-1"></i>Hapus size</button></div>`}
function featureRow(value='',name='feature'){return `<div class="feature-row flex gap-2"><input data-feature="${name}" value="${esc(value)}" placeholder="Feature" class="flex-1 px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm"><button type="button" onclick="this.parentElement.remove()" class="px-3 text-red-600"><i class="fa-solid fa-trash"></i></button></div>`}
function renderProductFormPage(){const edit=state.formMode==='edit',p=state.currentProduct||{};appTitle.textContent=edit?'Edit Produk Apple':'Tambah Produk Baru';backBtn.classList.remove('hidden');addProductBtn.classList.add('hidden');const colors=parseArray(p.variant_color),sizes=parseArray(p.variant_size),main=parseArray(p.main_features),sub=parseArray(p.sub_features);mainContent.innerHTML=`<form id="product-form" class="p-4 space-y-4 pb-24"><section class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3"><h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Informasi Utama</h3>${field('item_group_id','Item Group ID *',p.item_group_id,'Contoh: IPHONE-15-PRO',edit)}${field('title','Judul Produk (Title) *',p.title,'iPhone 15 Pro Max 256GB')}${field('description','Deskripsi',p.description,'Deskripsi lengkap produk...',false,true)}<div class="grid grid-cols-2 gap-3">${selectField('availability','Ketersediaan',p.availability,[['in stock','In Stock'],['out of stock','Out of Stock']])}${selectField('condition','Kondisi',p.condition,[['new','New'],['refurbished','Refurbished']])}</div><div class="grid grid-cols-2 gap-3">${field('brand','Brand',p.brand||'Apple')}${field('product_type','Product Type',p.product_type,'Smartphones')}</div>${field('link','Link URL',p.link,'https://apple.com/...')}${field('google_product_category','Google Product Category',p.google_product_category)}</section><section class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3"><div class="flex items-center justify-between"><h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Variant Color (JSON Array of Objects)</h3><button type="button" onclick="addColor()" class="text-xs bg-gray-900 text-white px-3 py-1.5 rounded-lg"><i class="fa-solid fa-plus mr-1"></i>Tambah</button></div><div id="color-list" class="space-y-2">${colors.map(x=>inputRow('color',x)).join('')}</div></section><section class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3"><div class="flex items-center justify-between"><h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Variant Size (JSON Array of Objects)</h3><button type="button" onclick="addSize()" class="text-xs bg-gray-900 text-white px-3 py-1.5 rounded-lg"><i class="fa-solid fa-plus mr-1"></i>Tambah</button></div><div id="size-list" class="space-y-2">${sizes.map(x=>inputRow('size',x)).join('')}</div></section><section class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3"><div class="flex items-center justify-between"><h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Main Features (JSON Array)</h3><button type="button" onclick="addFeature('main_features')" class="text-xs bg-gray-900 text-white px-3 py-1.5 rounded-lg"><i class="fa-solid fa-plus mr-1"></i>Tambah</button></div><div id="main-features" class="space-y-2">${main.map(x=>featureRow(x,'main_features')).join('')}</div><div class="flex items-center justify-between pt-3 border-t"><h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Sub Features (JSON Array)</h3><button type="button" onclick="addFeature('sub_features')" class="text-xs bg-gray-900 text-white px-3 py-1.5 rounded-lg"><i class="fa-solid fa-plus mr-1"></i>Tambah</button></div><div id="sub-features" class="space-y-2">${sub.map(x=>featureRow(x,'sub_features')).join('')}</div></section><section class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3"><h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Custom Labels</h3><div class="grid grid-cols-2 gap-2">${[0,1,2,3].map(i=>`<input name="custom_label_${i}" value="${esc(p['custom_label_'+i])}" placeholder="Label ${i}" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs">`).join('')}</div></section><section class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3"><h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Lainnya</h3>${field('quantity_to_sell_on_facebook','Quantity to Sell on Facebook',p.quantity_to_sell_on_facebook??10,'',false,false,'number')}</section><div class="fixed bottom-0 left-0 right-0 max-w-[500px] mx-auto bg-white/95 backdrop-blur-md border-t border-gray-200 p-3 flex gap-3 z-20"><button type="button" id="cancel-form-btn" class="flex-1 bg-gray-100 text-gray-700 font-medium py-2.5 rounded-xl text-sm">Batal</button><button type="submit" class="flex-1 bg-blue-600 text-white font-medium py-2.5 rounded-xl text-sm shadow-lg"><i class="fa-solid fa-floppy-disk mr-1"></i>Simpan</button></div></form>`;document.getElementById('cancel-form-btn').onclick=()=>{state.view='list';render()};document.getElementById('product-form').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),payload={};for(const [k,v] of fd.entries())payload[k]=k==='quantity_to_sell_on_facebook'?(v?parseInt(v,10):null):(v===''?null:v);payload.variant_color=[...document.querySelectorAll('#color-list .json-row')].map(r=>Object.fromEntries([...r.querySelectorAll('input')].map(i=>[i.dataset.key,i.value]))).filter(x=>x.color||x.image_link||x.additional_image_link);payload.variant_size=[...document.querySelectorAll('#size-list .json-row')].map(r=>Object.fromEntries([...r.querySelectorAll('input')].map(i=>[i.dataset.key,i.type==='number'?(i.value===''?null:Number(i.value)):i.value]))).filter(x=>x.size||x.price!==null||x.sale_price!==null);payload.main_features=[...document.querySelectorAll('#main-features input')].map(i=>i.value.trim()).filter(Boolean);payload.sub_features=[...document.querySelectorAll('#sub-features input')].map(i=>i.value.trim()).filter(Boolean);saveProduct(payload,edit,p.item_group_id)}}
function field(name,label,value='',placeholder='',readonly=false,textarea=false,type='text'){return `<div><label class="block text-xs font-semibold text-gray-700 mb-1">${label}</label>${textarea?`<textarea name="${name}" rows="3" placeholder="${esc(placeholder)}" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm">${esc(value)}</textarea>`:`<input type="${type}" name="${name}" ${readonly?'readonly':''} value="${esc(value)}" placeholder="${esc(placeholder)}" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm ${readonly?'text-gray-500 bg-gray-100':''}">`}</div>`}
function selectField(name,label,value,opts){return `<div><label class="block text-xs font-semibold text-gray-700 mb-1">${label}</label><select name="${name}" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm">${opts.map(o=>`<option value="${o[0]}" ${value===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}
window.addColor=()=>document.getElementById('color-list').insertAdjacentHTML('beforeend',inputRow('color',{}));window.addSize=()=>document.getElementById('size-list').insertAdjacentHTML('beforeend',inputRow('size',{}));window.addFeature=name=>document.getElementById(name==='main_features'?'main-features':'sub-features').insertAdjacentHTML('beforeend',featureRow('',name));window.editProduct=id=>{const p=state.products.find(x=>x.item_group_id===id);if(p){state.currentProduct=p;state.formMode='edit';state.view='form';render()}};window.promptDelete=id=>{state.deleteTargetId=id;deleteModal.classList.remove('hidden')};
function render(){state.view==='list'?renderProductListPage():renderProductFormPage()}
addProductBtn.onclick=()=>{state.currentProduct=null;state.formMode='create';state.view='form';render()};backBtn.onclick=()=>{state.view='list';render()};document.getElementById('cancel-delete').onclick=()=>{deleteModal.classList.add('hidden');state.deleteTargetId=null};document.getElementById('confirm-delete').onclick=()=>{if(state.deleteTargetId)deleteProductApi(state.deleteTargetId);deleteModal.classList.add('hidden');state.deleteTargetId=null};window.addEventListener('DOMContentLoaded',fetchProducts);
</script>
</body>
</html>
