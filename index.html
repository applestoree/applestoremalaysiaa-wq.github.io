<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Produk Kelola Produk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
        }
        /* Mobile container constraints per specification */
        .mobile-container {
            max-width: 500px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        @media (min-width: 501px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100%;
            }
            .mobile-container {
                height: 90vh;
                border-radius: 2rem;
                border: 8px solid #1f2937;
            }
        }
    </style>
</head>
<body>

    <div id="app" class="mobile-container">
        <!-- Header Section -->
        <header class="bg-gray-900 text-white px-4 py-3 flex items-center justify-between shadow-md z-10">
            <div class="flex items-center space-x-3">
                <button id="back-btn" class="hidden text-gray-300 hover:text-white transition-colors p-2">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>
                <h1 id="app-title" class="text-lg font-semibold tracking-wide flex items-center gap-2">
                    <i class="fa-brands fa-apple text-xl text-gray-100"></i> Apple Produk
                </h1>
            </div>
            <div id="header-actions" class="flex items-center space-x-2">
                <button id="add-product-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-1.5 rounded-xl font-medium shadow transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-plus"></i> Baru
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto relative bg-gray-50 flex flex-col" id="main-content">
            <!-- Dynamic views injected here -->
        </main>

        <!-- Toast Notification Container -->
        <div id="toast-container" class="absolute bottom-4 left-4 right-4 z-50 pointer-events-none flex flex-col gap-2 items-center"></div>

        <!-- Delete Confirmation Modal -->
        <div id="delete-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-all">
                <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-xl mb-4 mx-auto">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-900 text-center mb-1">Hapus Produk?</h3>
                <p class="text-sm text-gray-500 text-center mb-6">Tindakan ini tidak dapat dibatalkan dari sistem.</p>
                <div class="flex space-x-3">
                    <button id="cancel-delete" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 rounded-xl transition-colors">Batal</button>
                    <button id="confirm-delete" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded-xl transition-colors shadow-lg shadow-red-600/30">Hapus</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API & App configuration based on spec v9
        const API_BASE = "https://jhpbtooefyzdndstlzva.supabase.co/functions/v1/apple-produk-kelola-produk";
        
        let state = {
            view: 'list', // 'list' or 'form'
            formMode: 'create', // 'create' or 'edit'
            products: [],
            loading: false,
            searchQuery: '',
            selectedProductType: '',
            selectedAvailability: '',
            currentProduct: null,
            deleteTargetId: null
        };

        // DOM Elements
        const mainContent = document.getElementById('main-content');
        const backBtn = document.getElementById('back-btn');
        const addProductBtn = document.getElementById('add-product-btn');
        const appTitle = document.getElementById('app-title');
        const toastContainer = document.getElementById('toast-container');
        const deleteModal = document.getElementById('delete-modal');
        const cancelDeleteBtn = document.getElementById('cancel-delete');
        const confirmDeleteBtn = document.getElementById('confirm-delete');

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-gray-900 text-white' : 'bg-red-600 text-white';
            const icon = type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-white';
            
            toast.className = `${bgClass} px-4 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-3 transform translate-y-4 opacity-0 transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
            
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        async function fetchProducts() {
            state.loading = true;
            render();
            try {
                let url = API_BASE;
                const params = new URLSearchParams();
                if (state.searchQuery) params.append('search', state.searchQuery);
                if (state.selectedProductType) params.append('product_type', state.selectedProductType);
                if (state.selectedAvailability) params.append('availability', state.selectedAvailability);
                
                if (params.toString()) url += `?${params.toString()}`;

                const response = await fetch(url);
                if (!response.ok) throw new Error('Gagal mengambil data produk');
                const data = await response.json();
                state.products = Array.isArray(data) ? data : (data.data || []);
            } catch (err) {
                console.error(err);
                showToast('Gagal memuat daftar produk', 'error');
                state.products = [];
            } finally {
                state.loading = false;
                render();
            }
        }

        async function saveProduct(payload, isEdit, itemGroupId) {
            try {
                const url = isEdit ? `${API_BASE}/${itemGroupId}` : API_BASE;
                const method = isEdit ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errRes = await response.json().catch(() => ({}));
                    throw new Error(errRes.message || 'Gagal menyimpan produk');
                }

                showToast(isEdit ? 'Produk berhasil diperbarui!' : 'Produk baru berhasil ditambahkan!');
                state.view = 'list';
                fetchProducts();
            } catch (err) {
                console.error(err);
                showToast(err.message, 'error');
            }
        }

        async function deleteProductApi(itemGroupId) {
            try {
                const response = await fetch(`${API_BASE}/${itemGroupId}`, {
                    method: 'DELETE'
                });
                if (!response.ok) throw new Error('Gagal menghapus produk');
                
                showToast('Produk berhasil dihapus');
                fetchProducts();
            } catch (err) {
                console.error(err);
                showToast('Gagal menghapus produk', 'error');
            }
        }

        function renderProductListPage() {
            appTitle.innerHTML = `<i class="fa-brands fa-apple text-xl text-gray-100"></i> Apple Produk`;
            backBtn.classList.add('hidden');
            addProductBtn.classList.remove('hidden');

            const productTypes = [...new Set(state.products.map(p => p.product_type).filter(Boolean))];

            mainContent.innerHTML = `
                <div class="p-4 space-y-4">
                    <!-- Search & Filters -->
                    <div class="space-y-2">
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </span>
                            <input type="text" id="search-input" value="${state.searchQuery}" placeholder="Cari produk Apple..." 
                                class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition-all">
                        </div>
                        <div class="flex gap-2">
                            <select id="filter-type" class="flex-1 bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Semua Tipe Produk</option>
                                ${productTypes.map(t => `<option value="${t}" ${state.selectedProductType === t ? 'selected' : ''}>${t}</option>`).join('')}
                            </select>
                            <select id="filter-avail" class="w-36 bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Ketersediaan</option>
                                <option value="in stock" ${state.selectedAvailability === 'in stock' ? 'selected' : ''}>In Stock</option>
                                <option value="out of stock" ${state.selectedAvailability === 'out of stock' ? 'selected' : ''}>Out of Stock</option>
                            </select>
                        </div>
                    </div>

                    <!-- Counter & Result Header -->
                    <div class="flex items-center justify-between px-1">
                        <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Daftar Produk (${state.products.length})</span>
                    </div>

                    <!-- Product List or States -->
                    <div id="product-list-container" class="space-y-3 pb-6">
                        ${state.loading ? `
                            <div class="flex flex-col items-center justify-center py-16 space-y-3">
                                <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                                <p class="text-xs text-gray-500 font-medium">Memuat produk...</p>
                            </div>
                        ` : state.products.length === 0 ? `
                            <div class="flex flex-col items-center justify-center py-16 bg-white rounded-3xl border border-dashed border-gray-200 p-6 text-center shadow-sm">
                                <div class="w-14 h-14 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center text-2xl mb-3">
                                    <i class="fa-solid fa-box-open"></i>
                                </div>
                                <h3 class="font-semibold text-gray-800 text-sm">Tidak ada produk ditemukan</h3>
                                <p class="text-xs text-gray-500 mt-1">Coba sesuaikan kata kunci pencarian atau buat produk baru.</p>
                            </div>
                        ` : state.products.map(product => `
                            <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition-all flex flex-col gap-2 relative">
                                <div class="flex items-start justify-between">
                                    <div>
                                        <span class="inline-block px-2 py-0.5 bg-blue-50 text-blue-700 text-[10px] font-semibold rounded-md mb-1">${product.product_type || 'Apple Device'}</span>
                                        <h3 class="font-semibold text-gray-900 text-sm leading-snug">${product.title}</h3>
                                    </div>
                                    <span class="px-2 py-0.5 text-[10px] font-medium rounded-full ${product.availability === 'in stock' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
                                        ${product.availability || 'Unknown'}
                                    </span>
                                </div>
                                <p class="text-xs text-gray-500 line-clamp-2">${product.description || 'Tidak ada deskripsi.'}</p>
                                <div class="pt-2 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
                                    <span class="font-mono text-[11px] text-gray-400">ID: ${product.item_group_id}</span>
                                    <div class="flex items-center gap-1.5">
                                        <button onclick="editProduct('${product.item_group_id}')" class="px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition-colors">
                                            <i class="fa-solid fa-pen-to-square mr-1"></i> Edit
                                        </button>
                                        <button onclick="promptDelete('${product.item_group_id}')" class="p-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg transition-colors">
                                            <i class="fa-solid fa-trash-can text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            // Bind list event listeners
            document.getElementById('search-input').addEventListener('input', (e) => {
                state.searchQuery = e.target.value;
                debounceFetch();
            });
            document.getElementById('filter-type').addEventListener('change', (e) => {
                state.selectedProductType = e.target.value;
                fetchProducts();
            });
            document.getElementById('filter-avail').addEventListener('change', (e) => {
                state.selectedAvailability = e.target.value;
                fetchProducts();
            });
        }

        // Debounce helper for search
        let searchTimeout;
        function debounceFetch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                fetchProducts();
            }, 400);
        }

        function renderProductFormPage() {
            const isEdit = state.formMode === 'edit';
            const p = state.currentProduct || {};

            appTitle.innerHTML = isEdit ? `Edit Produk Apple` : `Tambah Produk Baru`;
            backBtn.classList.remove('hidden');
            addProductBtn.classList.add('hidden');

            // Helper for parsing JSON fields safely
            const formatJson = (val) => {
                if (!val) return '';
                if (typeof val === 'string') return val;
                return JSON.stringify(val, null, 2);
            };

            mainContent.innerHTML = `
                <form id="product-form" class="p-4 space-y-4 pb-20">
                    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Informasi Utama</h3>
                        
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Item Group ID *</label>
                            <input type="text" name="item_group_id" required ${isEdit ? 'readonly' : ''} value="${p.item_group_id || ''}" 
                                placeholder="Contoh: IPHONE-15-PRO" 
                                class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 ${isEdit ? 'text-gray-500 bg-gray-100 cursor-not-allowed' : ''}">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Judul Produk (Title) *</label>
                            <input type="text" name="title" required value="${p.title || ''}" placeholder="iPhone 15 Pro Max 256GB" 
                                class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Deskripsi</label>
                            <textarea name="description" rows="3" placeholder="Deskripsi lengkap produk..." 
                                class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">${p.description || ''}</textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Ketersediaan</label>
                                <select name="availability" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="in stock" ${p.availability === 'in stock' ? 'selected' : ''}>In Stock</option>
                                    <option value="out of stock" ${p.availability === 'out of stock' ? 'selected' : ''}>Out of Stock</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Kondisi</label>
                                <select name="condition" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="new" ${p.condition === 'new' ? 'selected' : ''}>New</option>
                                    <option value="refurbished" ${p.condition === 'refurbished' ? 'selected' : ''}>Refurbished</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Brand</label>
                                <input type="text" name="brand" value="${p.brand || 'Apple'}" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Product Type</label>
                                <input type="text" name="product_type" value="${p.product_type || ''}" placeholder="Smartphones" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Link URL</label>
                            <input type="text" name="link" value="${p.link || ''}" placeholder="https://apple.com/id/iphone..." class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Google Product Category</label>
                            <input type="text" name="google_product_category" value="${p.google_product_category || ''}" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <!-- Variant & Advanced JSON Fields -->
                    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Atribut & Varian (JSON)</h3>
                        
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Variant Color (JSON Array/Object)</label>
                            <textarea name="variant_color" rows="2" placeholder='["Natural Titanium", "Blue Titanium"]' class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl font-mono text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">${formatJson(p.variant_color)}</textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Variant Size (JSON Array/Object)</label>
                            <textarea name="variant_size" rows="2" placeholder='["128GB", "256GB", "512GB"]' class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl font-mono text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">${formatJson(p.variant_size)}</textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Main Features (JSON)</label>
                            <textarea name="main_features" rows="2" placeholder='["A17 Pro chip", "Titanium design"]' class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl font-mono text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">${formatJson(p.main_features)}</textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Sub Features (JSON)</label>
                            <textarea name="sub_features" rows="2" placeholder='{"camera": "48MP Main"}' class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl font-mono text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">${formatJson(p.sub_features)}</textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Headline</label>
                                <input type="text" name="headline" value="${p.headline || ''}" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1">Band</label>
                                <input type="text" name="band" value="${p.band || ''}" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Quantity to Sell on Facebook</label>
                            <input type="number" name="quantity_to_sell_on_facebook" value="${p.quantity_to_sell_on_facebook || 10}" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <!-- Custom Labels -->
                    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm space-y-3">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Custom Labels</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" name="custom_label_0" value="${p.custom_label_0 || ''}" placeholder="Label 0" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="text" name="custom_label_1" value="${p.custom_label_1 || ''}" placeholder="Label 1" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="text" name="custom_label_2" value="${p.custom_label_2 || ''}" placeholder="Label 2" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="text" name="custom_label_3" value="${p.custom_label_3 || ''}" placeholder="Label 3" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="text" name="custom_label_4" value="${p.custom_label_4 || ''}" placeholder="Label 4" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="text" name="custom_label_5" value="${p.custom_label_5 || ''}" placeholder="Label 5" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <!-- Sticky Bottom Action Bar -->
                    <div class="fixed bottom-0 left-0 right-0 max-w-[500px] mx-auto bg-white/90 backdrop-blur-md border-t border-gray-200 p-3 flex gap-3 z-20">
                        <button type="button" id="cancel-form-btn" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 rounded-xl text-sm transition-colors">Batal</button>
                        <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl text-sm transition-colors shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-floppy-disk"></i> Simpan
                        </button>
                    </div>
                </form>
            `;

            // Bind Form events
            document.getElementById('cancel-form-btn').addEventListener('click', () => {
                state.view = 'list';
                render();
            });

            document.getElementById('product-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const payload = {};
                
                const jsonFields = ['variant_color', 'variant_size', 'main_features', 'sub_features'];

                for (let [key, value] of formData.entries()) {
                    if (jsonFields.includes(key) && value.trim()) {
                        try {
                            payload[key] = JSON.parse(value);
                        } catch (err) {
                            // If invalid JSON, send as raw string or empty object/array fallback
                            try {
                                payload[key] = eval(value);
                            } catch {
                                payload[key] = value;
                            }
                        }
                    } else if (key === 'quantity_to_sell_on_facebook') {
                        payload[key] = value ? parseInt(value, 10) : null;
                    } else {
                        payload[key] = value === '' ? null : value;
                    }
                }

                saveProduct(payload, isEdit, p.item_group_id);
            });
        }

        // Global functions exposed for event bindings
        window.editProduct = function(itemGroupId) {
            const product = state.products.find(p => p.item_group_id === itemGroupId);
            if (product) {
                state.currentProduct = product;
                state.formMode = 'edit';
                state.view = 'form';
                render();
            }
        };

        window.promptDelete = function(itemGroupId) {
            state.deleteTargetId = itemGroupId;
            deleteModal.classList.remove('hidden');
        };

        function render() {
            if (state.view === 'list') {
                renderProductListPage();
            } else if (state.view === 'form') {
                renderProductFormPage();
            }
        }

        // Event listeners for primary UI navigation
        addProductBtn.addEventListener('click', () => {
            state.currentProduct = null;
            state.formMode = 'create';
            state.view = 'form';
            render();
        });

        backBtn.addEventListener('click', () => {
            state.view = 'list';
            render();
        });

        cancelDeleteBtn.addEventListener('click', () => {
            deleteModal.classList.add('hidden');
            state.deleteTargetId = null;
        });

        confirmDeleteBtn.addEventListener('click', () => {
            if (state.deleteTargetId) {
                deleteProductApi(state.deleteTargetId);
                deleteModal.classList.add('hidden');
                state.deleteTargetId = null;
            }
        });

        // Initialize App on load
        window.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
        });
    </script>
</body>
</html>
